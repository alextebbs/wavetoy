# Air config for live-reloading the server
# Run: air (or go run github.com/air-verse/air)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags whisper -o ./tmp/server ./cmd/server"
  entrypoint = ["./tmp/server"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_dir = ["cmd", "internal", "migrations"]
  exclude_dir = ["tmp", "vendor", "node_modules", ".git", "frontend", "tmp_openwebrx", "tmp_tokoeka"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  kill_delay = "2s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false
  watch_delay = 0

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true
